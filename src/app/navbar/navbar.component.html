<header class="sticky top-0 z-30 border-b border-hairline bg-surface">
  <nav class="mx-auto flex h-16 max-w-[120rem] items-center gap-2 px-4 sm:px-6 lg:px-10" aria-label="Main">
    <a routerLink="" class="flex items-center gap-2 text-ink no-underline">
      <img src="assets/img/logo.png" alt="" height="32" class="h-8 w-auto" />
      <span class="hidden font-bold sm:inline">WuWa calculator</span>
    </a>

    <ul class="ml-2 flex items-center gap-1 text-sm">
      <li>
        <a routerLink="" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="text-ink bg-surface-2"
          class="rounded-sm px-3 py-2 text-mute no-underline hover:text-ink">{{ 'home' | transloco }}</a>
      </li>
      <li>
        <a routerLink="/faq" routerLinkActive="text-ink bg-surface-2"
          class="rounded-sm px-3 py-2 text-mute no-underline hover:text-ink">FAQ</a>
      </li>
    </ul>

    <div class="ml-auto flex items-center gap-1">
      <button type="button" class="ui-icon-btn" [title]="'settings.settings' | transloco"
        [attr.aria-label]="'settings.settings' | transloco" (click)="openSettings()">
        <span class="material-symbols-outlined" aria-hidden="true">settings</span>
      </button>
    </div>
  </nav>
</header>
