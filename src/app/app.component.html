<app-navbar />
<router-outlet />

<footer class="mt-24 border-t border-hairline bg-surface">
  <div class="mx-auto max-w-[120rem] px-4 py-12 text-sm sm:px-6 lg:px-10 leading-relaxed text-mute">
    <h2 class="text-base font-bold text-ink">{{ 'info' | transloco }}</h2>
    <div class="mt-4 space-y-3 [&_a]:text-accent [&_a]:underline">
      <div [innerHtml]="'aboutInfo' | transloco"></div>
      <div [innerHtml]="'disclaimerInfo' | transloco"></div>
      <div [innerHtml]="'donation' | transloco"></div>
    </div>
  </div>
</footer>

@if (showCookieBanner()) {
  <div role="region" aria-label="Cookies"
    class="fixed inset-x-4 bottom-4 z-40 mx-auto flex max-w-3xl items-center gap-4 rounded-sm border border-hairline bg-surface p-4 text-xs text-body sm:text-sm">
    <p class="flex-1">{{ 'disclaimer' | transloco }}</p>
    <button type="button" class="ui-btn ui-btn-primary" (click)="settings.acceptCookies()">OK</button>
  </div>
}
