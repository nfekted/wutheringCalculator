<main class="mx-auto max-w-5xl px-4 py-12 sm:px-6 lg:px-10">
  <h1 class="text-3xl font-bold text-ink">FAQ</h1>

  <div class="mt-6 divide-y divide-hairline border-y border-hairline">
    @for (item of questions; track $index; let i = $index) {
      <details class="group py-1">
        <summary class="flex cursor-pointer list-none items-center justify-between gap-4 py-3 text-base font-medium text-ink">
          {{ 'faq.q' + (i + 1) | transloco }}
          <span class="material-symbols-outlined shrink-0 text-mute transition-transform group-open:rotate-180" aria-hidden="true">expand_more</span>
        </summary>
        <div class="pb-4 text-sm leading-relaxed text-body" [innerHTML]="'faq.a' + (i + 1) | transloco"></div>
      </details>
    }
  </div>
</main>
